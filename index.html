<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Algorithm Lab · 交互式算法实验室</title><style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#202124;background:#fff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1080px;margin:auto;padding:42px 22px 90px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:750}.logo{background:#e6f2ec;color:#277c58;border-radius:12px;width:39px;height:39px;display:grid;place-items:center;font-size:21px}.muted{color:#747a80}.eyebrow{font-size:12px;color:#4a866c;letter-spacing:.12em;font-weight:700;margin-top:65px}.hero h1{font-size:clamp(32px,5vw,52px);line-height:1.2;letter-spacing:-.04em;margin:13px 0 14px}.hero p{font-size:16px;color:#72777d;line-height:1.8;max-width:650px}.bar{display:flex;gap:12px;margin-top:35px}.search{width:100%;font:inherit;border:1px solid #e0e4e1;border-radius:13px;padding:15px 17px;outline:none;background:#fff}.search:focus{border-color:#76b59a;box-shadow:0 0 0 3px #e6f3ec}.filters{display:flex;flex-wrap:wrap;gap:9px;margin:19px 0 26px}.filter{border:1px solid #e5e8e5;background:#fff;border-radius:30px;padding:8px 15px;cursor:pointer;font:inherit;color:#555}.filter[aria-pressed=true]{background:#e9f4ed;border-color:#c9e6d4;color:#216b4b;font-weight:700}.topline{display:flex;justify-content:space-between;align-items:center;margin:25px 0 17px}.topline h2{font-size:19px;margin:0}.count{font-size:13px;color:#8a8f93}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{border:1px solid #e5e8e5;border-radius:17px;padding:22px;background:#fff;min-height:205px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;transition:border-color .2s,transform .2s,box-shadow .2s}.card.available:hover{transform:translateY(-3px);border-color:#8bc3a7;box-shadow:0 8px 26px #203d3010}.card.disabled{background:#fbfcfb;opacity:.7;cursor:default}.card-top{display:flex;justify-content:space-between;align-items:center}.number{font-size:12px;color:#858b89}.status{font-size:12px;color:#227a52;background:#e8f4ec;padding:4px 9px;border-radius:20px}.status.soon{color:#777;background:#f0f1f0}.card h3{font-size:17px;line-height:1.45;margin:7px 0 0}.card p{font-size:13px;color:#747a78;line-height:1.6;margin:0}.tag{font-size:12px;color:#688777;margin-top:auto;padding-top:10px}.empty{padding:60px 12px;text-align:center;color:#888;border:1px dashed #e3e6e3;border-radius:14px}.footer{margin-top:48px;border-top:1px solid #ecefec;padding-top:20px;color:#8a8e8b;font-size:13px}@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.wrap{padding:24px 16px 55px}.eyebrow{margin-top:43px}.grid{grid-template-columns:1fr}.card{min-height:170px}.hero p{font-size:14px}}
</style><link rel="stylesheet" href="./assets/theme.css"><style>
.wrap{max-width:1440px;padding-left:clamp(22px,4vw,68px);padding-right:clamp(22px,4vw,68px)}.hero p{max-width:760px}.grid{gap:20px}.card{min-height:210px;padding:25px}.card h3{font-size:18px}.card p{font-size:14px}.search{font-size:15px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:24px 17px 56px}}
</style></head><body><main class="wrap"><header><div class="brand"><span class="logo">⌘</span><span>Algorithm Lab</span></div><span class="muted" style="font-size:13px">交互式算法实验室</span></header><section class="hero"><div class="eyebrow">LEARN BY INTERACTING</div><h1>让算法的每一步，<br>都看得见。</h1><p>输入数据、逐步运行、观察变化。把抽象的算法逻辑变成可以亲手操作的过程。</p></section><div class="bar"><input class="search" id="search" placeholder="搜索 LeetCode 题号、题目名称或算法类型…" aria-label="搜索模拟器"></div><nav class="filters" id="filters" aria-label="按算法分类"></nav><div class="topline"><h2>算法模拟器</h2><span class="count" id="count"></span></div><section class="grid" id="cards" aria-live="polite"></section><footer class="footer">Algorithm Lab · 静态网页，无需账号。模拟器在浏览器本地运行。</footer></main><script>
const catalog=[{id:'1047',title:'删除字符串中的所有相邻重复项',category:'栈',description:'逐步观察字符入栈、出栈，以及重复字符的连锁消除。',url:'./simulators/lc1047/index.html',ready:true},{id:'167',title:'两数之和 II',category:'双指针',description:'观察左右指针如何根据目标和移动。',ready:false},{id:'15',title:'三数之和',category:'双指针',description:'固定数字、移动双指针与跳过重复组合。',ready:false},{id:'704',title:'二分查找',category:'二分查找',description:'直观看到搜索区间如何每次缩小一半。',ready:false},{id:'226',title:'翻转二叉树',category:'递归',description:'观察递归遍历和左右子树交换。',ready:false}];
let active='全部';const $=id=>document.getElementById(id);const categories=['全部',...new Set(catalog.map(x=>x.category))];const filters=$('filters');categories.forEach(c=>{const b=document.createElement('button');b.className='filter';b.textContent=c;b.type='button';b.setAttribute('aria-pressed',String(c===active));b.onclick=()=>{active=c;filters.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x.textContent===c)));render()};filters.append(b)});
function render(){const q=$('search').value.trim().toLowerCase();const items=catalog.filter(x=>(active==='全部'||x.category===active)&&[x.id,x.title,x.category,x.description].some(t=>t.toLowerCase().includes(q)));$('count').textContent=`${items.length} 个结果 · ${catalog.filter(x=>x.ready).length} 个已上线`;const cards=$('cards');cards.replaceChildren();if(!items.length){const d=document.createElement('div');d.className='empty';d.textContent='没有找到匹配的模拟器，试试其他关键词。';cards.append(d);return}items.forEach(x=>{const a=document.createElement(x.ready?'a':'article');a.className='card '+(x.ready?'available':'disabled');if(x.ready)a.href=x.url;const top=document.createElement('div');top.className='card-top';const num=document.createElement('span');num.className='number';num.textContent='LeetCode '+x.id;const status=document.createElement('span');status.className='status '+(x.ready?'':'soon');status.textContent=x.ready?'开始体验 ↗':'计划中';top.append(num,status);const title=document.createElement('h3');title.textContent=x.title;const desc=document.createElement('p');desc.textContent=x.description;const tag=document.createElement('span');tag.className='tag';tag.textContent='# '+x.category;a.append(top,title,desc,tag);cards.append(a)})} $('search').addEventListener('input',render);render();
</script></body></html>
